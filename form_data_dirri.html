<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .kotak-form {
            max-width: 450px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 20px 25px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .grup-input {
            margin-bottom: 15px;
        }
        .label-judul {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .pilihan-hobi label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #0069d9;
        }
    </style>
</head>
<body>

    <div class="kotak-form">
        <h2>Formulir Data Diri</h2>

        <form action="proses_data_diri.php" method="POST">
            <div class="grup-input">
                <label class="label-judul" for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" required>
            </div>

            <div class="grup-input">
                <label class="label-judul" for="tanggal_lahir">Tanggal Lahir:</label>
                <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>
            </div>

            <div class="grup-input pilihan-hobi">
                <span class="label-judul">Hobi:</span>
                <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
            </div>

            <button type="submit">Kirim</button>
        </form>
    </div>

</body>
</html>
